databases:
  - name: rps-db
    databaseName: rps
    plan: free

services:
  - type: web
    name: rps-online
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # you type this in the Render dashboard (or set ADMIN_PHONE)
      - key: DATABASE_URL
        fromDatabase:
          name: rps-db
          property: connectionString
